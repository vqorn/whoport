name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        cc: [gcc, clang]
        exclude:
          - os: macos-latest
            cc: gcc   # gcc is an alias for clang on macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build without warnings
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -Werror"
      - name: Unit and integration tests
        run: make CC=${{ matrix.cc }} test

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build without warnings
        run: make CFLAGS="-O2 -Werror"
      - name: Unit and integration tests
        run: make test
