name: Release

# Builds binaries and attaches them to a GitHub release. Either push a tag
# like v1.0.0, or run it by hand (Actions > Release > Run workflow) with a
# version number; the tag and release are then created automatically.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v, e.g. 1.0.0'
        required: true

env:
  # "v1.0.0" from a pushed tag, or "v" + the version typed in by hand
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

permissions:
  contents: write

jobs:
  unix:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-arm64
          - os: macos-latest
            target: macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          VERSION="${TAG#v}"
          if [ "${{ matrix.target }}" = "macos-universal" ]; then
            make VERSION="$VERSION" CFLAGS="-O2 -arch arm64 -arch x86_64"
          else
            make VERSION="$VERSION"
          fi
          make VERSION="$VERSION" test
          ./whoport --version
          tar czf "whoport-${{ matrix.target }}.tar.gz" whoport README.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: whoport ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: whoport-${{ matrix.target }}.tar.gz

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          path-type: inherit
          install: make zip mingw-w64-ucrt-x86_64-gcc
      - name: Build
        run: |
          VERSION="${TAG#v}"
          # Static runtime: the .exe runs on any Windows 10/11 without extra DLLs.
          make VERSION="$VERSION" LDFLAGS="-static"
          make VERSION="$VERSION" LDFLAGS="-static" test
          ./whoport.exe --version
          zip whoport-windows-x86_64.zip whoport.exe README.md LICENSE
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: whoport ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: whoport-windows-x86_64.zip
